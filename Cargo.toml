[workspace]
resolver = "2"
members = [
    "crates/achat-core",
    "crates/achat-provider",
    "crates/achat-agent",
    "crates/achat-store",
    "crates/achat-sync",
    "crates/achat-server",
    "crates/achat-desktop",
]

[workspace.package]
version = "4.0.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/AprilNEA/AChat"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Types
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls"] }
rusqlite = { version = "0.32", features = ["bundled", "uuid"] }

# HTTP
axum = { version = "0.8" }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json", "stream"] }

# Tauri
tauri = { version = "2" }
tauri-build = { version = "2" }

# Internal crates
achat-core = { path = "crates/achat-core" }
achat-provider = { path = "crates/achat-provider" }
achat-agent = { path = "crates/achat-agent" }
achat-store = { path = "crates/achat-store" }
achat-sync = { path = "crates/achat-sync" }
