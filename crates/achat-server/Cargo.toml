[package]
name = "achat-server"
description = "Axum cloud server for AChat"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "achat-server"
path = "src/main.rs"

[dependencies]
achat-core = { workspace = true }
achat-provider = { workspace = true }
achat-agent = { workspace = true }
achat-store = { workspace = true, features = ["postgres"] }
achat-sync = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
